name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Test and build development APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :scheduler:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Rename development APK
        run: |
          mkdir -p out/development
          cp app/build/outputs/apk/debug/app-debug.apk "out/development/kairos-debug-v1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kairos-debug-apk
          path: out/development/*.apk
          if-no-files-found: error
      - name: Check release signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'The development APK is available in the kairos-debug-apk artifact. Configure all four release signing secrets to also publish a signed release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Decode fixed signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Test and build signed APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :scheduler:test :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease
      - name: Rename APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          mkdir -p out/release
          cp app/build/outputs/apk/release/app-release.apk "out/release/kairos-v1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.signing.outputs.configured == 'true'
        with:
          name: kairos-apk
          path: out/release/*.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        if: steps.signing.outputs.configured == 'true'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Kairos build ${{ github.run_number }}
          files: out/release/*.apk
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
